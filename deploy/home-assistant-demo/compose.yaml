# Arvuno Core — Home Assistant demo environment.
#
# Start with:  docker compose up -d
# Open:        http://localhost:8123  (complete onboarding, then enable demo)
services:
  homeassistant:
    image: homeassistant/home-assistant:2026.11.1
    container_name: homeassistant
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config:/config
    ports:
      - "127.0.0.1:8123:8123"
